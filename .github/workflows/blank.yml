name: Build Driver APK For mail

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'APK 包名'
        required: true
        default: 'com.plugin.renderer.turnip'
      driver_name:
        description: '驱动名称'
        required: true
        default: 'Turnip'
      driver_zip_url:
        description: '包含驱动文件的 ZIP 下载链接'
        required: true
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 下载并解压完整驱动包
        run: |
          mkdir -p app/src/main/assets/driver
          mkdir -p app/src/main/jniLibs/arm64-v8a

          curl -L -o driver.zip "${{ github.event.inputs.driver_zip_url }}"

          unzip -o driver.zip -d app/src/main/assets/driver/

          if [ -f app/src/main/assets/driver/libvulkan_freedreno.so ]; then
            cp app/src/main/assets/driver/libvulkan_freedreno.so app/src/main/jniLibs/arm64-v8a/
          else
            find app/src/main/assets/driver -name "libvulkan_freedreno.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
          fi

          # 5. 打印文件列表确认
          echo "===== 解压后的文件列表 ====="
          ls -R app/src/main/assets/driver/

      - name: 修改包名和应用名称
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          sed -i 's/applicationId = "[^"]*"/applicationId = "${{ github.event.inputs.package_name }}"/' $GRADLE_FILE
          sed -i 's/applicationIdSuffix = "[^"]*"/applicationIdSuffix = ""/' $GRADLE_FILE
          sed -i 's/resValue("string","app_name","[^"]*")/resValue("string","app_name","${{ github.event.inputs.driver_name }}")/' $GRADLE_FILE
          sed -i 's/manifestPlaceholders\["driver"\] = "[^"]*"/manifestPlaceholders["driver"] = "${{ github.event.inputs.driver_name }}"/' $GRADLE_FILE
          sed -i 's/package="[^"]*"/package="${{ github.event.inputs.package_name }}"/' app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: 重命名 APK 为驱动名称
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             "app/build/outputs/apk/debug/${{ github.event.inputs.driver_name }}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.driver_name }}
          path: app/build/outputs/apk/debug/${{ github.event.inputs.driver_name }}.apk
