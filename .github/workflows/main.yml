name: Build Driver APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'APK 包名'
        required: true
        default: 'com.plugin.renderer.turnip'
      driver_name:
        description: '驱动名称'
        required: true
        default: 'Turnip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 修改包名、驱动名称和应用名称
        run: |
          GRADLE_FILE="app/build.gradle.kts"
          sed -i 's/applicationId = "[^"]*"/applicationId = "${{ github.event.inputs.package_name }}"/' $GRADLE_FILE
          sed -i 's/applicationIdSuffix = "[^"]*"/applicationIdSuffix = ""/' $GRADLE_FILE
          sed -i 's/resValue("string","app_name","[^"]*")/resValue("string","app_name","${{ github.event.inputs.driver_name }}")/' $GRADLE_FILE
          sed -i 's/manifestPlaceholders\["driver"\] = "[^"]*"/manifestPlaceholders["driver"] = "${{ github.event.inputs.driver_name }}"/' $GRADLE_FILE
          sed -i 's/package="[^"]*"/package="${{ github.event.inputs.package_name }}"/' app/src/main/AndroidManifest.xml
          echo "===== 修改结果 ====="
          grep -E "applicationId|applicationIdSuffix|resValue|manifestPlaceholders" $GRADLE_FILE

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCL-${{ github.event.inputs.driver_name }}
          path: app/build/outputs/apk/debug/*.apk
